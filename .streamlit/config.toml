[theme]
primaryColor = "#2563EB"       # Azul corporativo elegante
backgroundColor = "#F8FAFC"    # Fundo cinza bem suave (moderno e limpo)
secondaryBackgroundColor = "#FFFFFF" # Fundo branco para containers, sidebar e cards
textColor = "#1E293B"          # Cor do texto em tom chumbo escuro (excelente leitura)
font = "sans serif"            # Fonte limpa e profissional